<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" role="img" aria-label="Pairwave">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/><stop offset="1" stop-color="#101626"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eb0ff"/><stop offset="0.5" stop-color="#7c8cff"/><stop offset="1" stop-color="#5eb0ff"/>
    </linearGradient>
  </defs>
  <rect width="880" height="200" rx="14" fill="url(#bg)"/>
  <!-- two endpoints, one encrypted wave between them -->
  <circle cx="120" cy="100" r="34" fill="none" stroke="#5eb0ff" stroke-width="2.5"/>
  <circle cx="760" cy="100" r="34" fill="none" stroke="#7c8cff" stroke-width="2.5"/>
  <text x="120" y="107" font-family="ui-monospace,Consolas,monospace" font-size="20" fill="#dde3ee" text-anchor="middle">A</text>
  <text x="760" y="107" font-family="ui-monospace,Consolas,monospace" font-size="20" fill="#dde3ee" text-anchor="middle">B</text>
  <path d="M 158 100 C 220 40, 280 160, 340 100 S 460 40, 520 100 S 640 160, 722 100"
        fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 12;12 12" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <!-- padlock at the midpoint: the relay sees ciphertext only -->
  <rect x="424" y="84" width="32" height="26" rx="5" fill="#0b0e14" stroke="#4ade80" stroke-width="2"/>
  <path d="M 431 84 v-7 a9 9 0 0 1 18 0 v7" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="440" y="146" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b94a7" text-anchor="middle">the relay only ever sees ciphertext</text>
  <text x="440" y="44" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#dde3ee" text-anchor="middle">pair<tspan fill="#5eb0ff">wave</tspan></text>
  <text x="440" y="66" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b94a7" text-anchor="middle">two people · two Claude Codes · one end-to-end-encrypted channel</text>
</svg>

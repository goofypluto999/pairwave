name: verify

# Every push and pull request is gated by the full build + 95 tests. A green check here is the
# "approved to update" signal — for the maintainer's own pushes and for any contributor's fork PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build + test (must be green)
        run: npm run verify
